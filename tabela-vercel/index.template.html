<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yazı Tabelası</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #05060a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    text-align: center;
    padding: 4vmin;
    background-image: radial-gradient(circle at 50% 35%, #14131f 0%, #05060a 70%);
  }
  #board {
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.01em;
    max-width: 100%;
    word-break: break-word;
    white-space: pre-wrap;
    /* Gökkuşağı: hareketli renk gradyanı, yazının içine kırpılır */
    background-image: linear-gradient(
      90deg,
      #ff0040, #ff8a00, #ffee00, #26ff5c,
      #00e5ff, #4f6bff, #d400ff, #ff0040
    );
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: rainbow-slide 6s linear infinite;
    filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.18));
  }
  @keyframes rainbow-slide {
    from { background-position: 0% 50%; }
    to   { background-position: 300% 50%; }
  }
  /* Hareket azaltma tercihi olan cihazlarda animasyonu durdur */
  @media (prefers-reduced-motion: reduce) {
    #board { animation: none; }
  }
</style>
</head>
<body>
  <div id="board">__MESAJ__</div>
<script>
  // Yazıyı ekrana sığacak en büyük boyuta otomatik ölçekle
  (function () {
    var board = document.getElementById("board");
    function fit() {
      var fs = 30; // vw cinsinden başlangıç
      board.style.fontSize = fs + "vw";
      var guard = 0;
      while (guard++ < 300 &&
             (board.scrollWidth > window.innerWidth * 0.92 ||
              board.scrollHeight > window.innerHeight * 0.92) &&
             fs > 1) {
        fs -= 0.5;
        board.style.fontSize = fs + "vw";
      }
    }
    fit();
    window.addEventListener("resize", fit);
  })();
</script>
</body>
</html>
